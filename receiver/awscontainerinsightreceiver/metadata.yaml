display_name: AWS Container Insights Receiver
type: awscontainerinsightreceiver

status:
  class: receiver
  stability:
    beta: [metrics]
  distributions: [contrib]
  warnings: [Other]
  codeowners:
    active: [Aneurysm9, pxaws]

tests:
  goleak:
    ignore:
      top:
        # See https://github.com/census-instrumentation/opencensus-go/issues/1191 for more information.
        - "go.opencensus.io/stats/view.(*worker).start"

feature_gates:
  - id: receiver.awscontainerinsightreceiver.useNewTypeName
    description: "When enabled, the receiver uses the new component type name 'awscontainerinsight' instead of 'awscontainerinsightreceiver'."
    stage: alpha
    from_version: v0.143.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/44052
