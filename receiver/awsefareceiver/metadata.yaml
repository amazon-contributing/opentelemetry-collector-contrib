type: awsefareceiver

status:
  class: receiver
  stability:
    beta: [metrics]
  distributions: []
  codeowners:
    active: [mitali-salvi]

resource_attributes:
  device:
    enabled: true
    description: The EFA device name (e.g. rdmap0s31)
    type: string
  port:
    enabled: true
    description: The EFA port number
    type: string

metrics:
  efa_rdma_read_bytes:
    description: The number of bytes received using RDMA read operations
    enabled: true
    sum:
      monotonic: true
      aggregation_temporality: cumulative
      value_type: int
    unit: "By"
  efa_rdma_write_bytes:
    description: The number of bytes written by other instances using RDMA write operations
    enabled: true
    sum:
      monotonic: true
      aggregation_temporality: cumulative
      value_type: int
    unit: "By"
  efa_rdma_write_recv_bytes:
    description: The number of bytes received by RDMA write operations
    enabled: true
    sum:
      monotonic: true
      aggregation_temporality: cumulative
      value_type: int
    unit: "By"
  efa_rx_bytes:
    description: The number of bytes received
    enabled: true
    sum:
      monotonic: true
      aggregation_temporality: cumulative
      value_type: int
    unit: "By"
  efa_rx_dropped:
    description: The number of packets that were received and then dropped
    enabled: true
    sum:
      monotonic: true
      aggregation_temporality: cumulative
      value_type: int
    unit: "1"
  efa_tx_bytes:
    description: The number of bytes transmitted
    enabled: true
    sum:
      monotonic: true
      aggregation_temporality: cumulative
      value_type: int
    unit: "By"
  efa_retrans_bytes:
    description: The number of EFA SRD bytes retransmitted
    enabled: true
    sum:
      monotonic: true
      aggregation_temporality: cumulative
      value_type: int
    unit: "By"
  efa_retrans_pkts:
    description: The number of EFA SRD packets retransmitted
    enabled: true
    sum:
      monotonic: true
      aggregation_temporality: cumulative
      value_type: int
    unit: "1"
  efa_retrans_timeout_events:
    description: The number of times EFA SRD traffic timed out and resulted in a network path change
    enabled: true
    sum:
      monotonic: true
      aggregation_temporality: cumulative
      value_type: int
    unit: "1"
  efa_unresponsive_remote_events:
    description: The number of times an EFA SRD remote connection was unresponsive
    enabled: true
    sum:
      monotonic: true
      aggregation_temporality: cumulative
      value_type: int
    unit: "1"
  efa_impaired_remote_conn_events:
    description: The number of times EFA SRD connections entered an impaired state resulting in a reduced throughput rate limit
    enabled: true
    sum:
      monotonic: true
      aggregation_temporality: cumulative
      value_type: int
    unit: "1"
