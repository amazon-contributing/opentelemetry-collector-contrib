    efa_retrans_pkts:
      enabled: true
    efa_retrans_timeout_events:
      enabled: true
    efa_rx_bytes:
      enabled: true
    efa_rx_dropped:
      enabled: true
    efa_rx_pkts:
      enabled: true
    efa_send_bytes:
      enabled: true
    efa_send_wrs:
      enabled: true
    efa_tx_bytes:
