default:
all_set:
  metrics:
    efa_impaired_remote_conn_events:
      enabled: true
    efa_rdma_read_bytes:
      enabled: true
    efa_rdma_read_resp_bytes:
      enabled: true
    efa_rdma_read_wr_err:
      enabled: true
    efa_rdma_read_wrs:
      enabled: true
    efa_rdma_write_bytes:
