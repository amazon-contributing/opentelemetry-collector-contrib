      enabled: true
    aws.efa.eni.id:
      enabled: true
    aws.efa.port:
      enabled: true
none_set:
  metrics:
    efa_impaired_remote_conn_events:
      enabled: false
    efa_rdma_read_bytes:
      enabled: false
    efa_rdma_read_resp_bytes:
      enabled: false
    efa_rdma_read_wr_err:
      enabled: false
    efa_rdma_read_wrs:
      enabled: false
