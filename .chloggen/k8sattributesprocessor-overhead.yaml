# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. filelogreceiver)
component: k8sattributesprocessor

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: add support for extracting a pod's spec.overhead as the k8s.pod.overhead.cpu and k8s.pod.overhead.memory resource attributes

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [534]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  k8s.pod.overhead.cpu (millicores) and k8s.pod.overhead.memory (bytes) are opt-in via the metadata list
  and are not added by default. They surface the RuntimeClass-declared pod overhead, which is set only for
  pods running under a RuntimeClass whose overhead.podFixed is non-empty (typically VM/sandbox runtimes).
  Each attribute is emitted only when the pod declares a non-zero overhead for that resource, so a
  downstream processor can treat the attribute's presence as overhead > 0 to distinguish VM-isolated pods.
