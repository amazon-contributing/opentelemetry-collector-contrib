receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:

  otlphttp/traces:
    compression: gzip
    traces_endpoint: https://xray.${env:AWS_REGION:-us-west-2}.amazonaws.com/v1/traces
    auth:
      authenticator: sigv4auth/traces

  otlphttp/logs:
    compression: gzip
    logs_endpoint: https://logs.${env:AWS_REGION:-us-west-2}.amazonaws.com/v1/logs
    headers:
      x-aws-log-group: ${env:AWS_APP_LOG_GROUP:-AgentCoreAppLogs}
      x-aws-log-stream: ${env:AWS_APP_LOG_STREAM:-default}
    auth:
      authenticator: sigv4auth/logs

  awsemf:
    region: ${env:AWS_REGION:-us-west-2}
    namespace: ${env:AWS_EMF_NAMESPACE:-AgentCoreMetrics}
    log_group_name: ${env:AWS_EMF_LOG_GROUP:-AgentCoreEMF}
    log_stream_name: ${env:AWS_EMF_LOG_STREAM:-default}
    resource_to_telemetry_conversion:
      enabled: true
    dimension_rollup_option: "NoDimensionRollup"

extensions:
  sigv4auth/traces:
    region: ${env:AWS_REGION:-us-west-2}
    service: xray

  sigv4auth/logs:
    region: ${env:AWS_REGION:-us-west-2}
    service: logs

service:
  extensions: [sigv4auth/traces, sigv4auth/logs]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsemf]