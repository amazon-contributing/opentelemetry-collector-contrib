name: e2e-tests

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
    paths-ignore:
      - "**/README.md"
  pull_request:
    paths-ignore:
      - "**/README.md"
  merge_group:

permissions:
  contents: read

env:
  # Make sure to exit early if cache segment download times out after 2 minutes.
  # We limit cache download as a whole to 5 minutes.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
jobs:
  collector-build:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-go-tools
        with:
          go-version: oldstable
      - name: Generate otelcontribcol files
        run: make genotelcontribcol
      - name: Build Collector
        run: make otelcontribcol
      - name: Upload Collector Binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: collector-binary
          path: ./bin/*
      - run: ./.github/workflows/scripts/check-disk-space.sh

  supervisor-test:
    runs-on: ubuntu-24.04
    needs: collector-build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-go-tools
        with:
          go-version: oldstable
      - name: Download Collector Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: collector-binary
          path: bin/
      - run: chmod +x bin/*
      - name: Run opampsupervisor e2e tests
        run: |
          cd cmd/opampsupervisor
          make e2e-test
      - run: ./.github/workflows/scripts/check-disk-space.sh

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-go-tools
        with:
          go-version: oldstable
      - name: Generate otelcontribcol files
        run: make genotelcontribcol
      - name: Build Docker Image
        run: |
          make docker-otelcontribcol
      - name: export image to tar
        run: |
          docker save otelcontribcol:latest > /tmp/otelcontribcol.tar
      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: otelcontribcol
          path: /tmp/otelcontribcol.tar
      - run: ./.github/workflows/scripts/check-disk-space.sh

  kubernetes-test-matrix:
    # id-token lets the resourcedetection matrix entry assume the AWS role that
    # authenticates ECR Public pulls (higher quota than anonymous). Secrets are not
    # exposed to fork PRs, so those skip auth and fall back to anonymous pulls.
    permissions:
      id-token: write
      contents: read
    env:
      KUBECONFIG: /tmp/kube-config-otelcol-e2e-testing
    strategy:
      fail-fast: false
      matrix:
        k8s-version:
          - "v1.34.0"
          - "v1.35.0"
        component:
          - receiver/k8sclusterreceiver
          - processor/k8sattributesprocessor
          - processor/resourcedetectionprocessor
          - receiver/kubeletstatsreceiver
          - receiver/k8sobjectsreceiver
          - extension/observer/k8sobserver
    runs-on: ubuntu-24.04
    needs: docker-build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-go-tools
        with:
          go-version: oldstable
      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          node_image: kindest/node:${{ matrix.k8s-version }}
          kubectl_version: ${{ matrix.k8s-version }}
          cluster_name: kind
          config: ./.github/workflows/configs/e2e-kind-config.yaml
      - name: Fix kubelet TLS server certificates
        run: |
          kubectl get csr -o=jsonpath='{range.items[?(@.spec.signerName=="kubernetes.io/kubelet-serving")]}{.metadata.name}{" "}{end}' | xargs kubectl certificate approve
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: otelcontribcol
          path: /tmp
      - name: Load Docker image
        run: |
          docker load --input /tmp/otelcontribcol.tar
      - name: Kind load image
        run: |
          kind load docker-image otelcontribcol:latest --name kind
      # ECR Public anonymous pulls share a per-IP data quota that intermittently 429s
      # on CI runners. When credentials are available (not on fork PRs), authenticate
      # so the pull uses the higher authenticated quota.
      - name: Detect ECR Public auth availability
        id: ecr_auth
        if: matrix.component == 'processor/resourcedetectionprocessor'
        env:
          ECR_AUTH_ACCOUNT_ID: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}
        run: |
          if [ -n "$ECR_AUTH_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure AWS credentials for ECR Public
        if: steps.ecr_auth.outputs.enabled == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}:role/${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ROLE_NAME }}
          aws-region: us-east-1
      - name: Pre-load resourcedetection e2e images into kind
        # These images use imagePullPolicy: IfNotPresent, so loading them into the
        # cluster up front means no per-pod registry pulls happen during the test run.
        if: matrix.component == 'processor/resourcedetectionprocessor'
        run: |
          if aws sts get-caller-identity >/dev/null 2>&1; then
            aws ecr-public get-login-password --region us-east-1 \
              | docker login --username AWS --password-stdin public.ecr.aws
          else
            echo "No AWS credentials available; attempting anonymous pulls."
          fi
          images=(
            "public.ecr.aws/aws-ec2/amazon-ec2-metadata-mock:v1.13.0"
            "curlimages/curl:8.6.0"
            "python:3.13-alpine"
          )
          for image in "${images[@]}"; do
            for attempt in 1 2 3; do
              docker pull "$image" && break
              echo "pull of $image failed (attempt $attempt); retrying"
              sleep "$((attempt * 15))"
            done
            kind load docker-image "$image" --name kind
          done
      - name: Run e2e tests
        run: |
          cd ${{ matrix.component }}
          go test -v --tags=e2e
      - run: ./.github/workflows/scripts/check-disk-space.sh

  kubernetes-test:
    if: ${{ github.actor != 'dependabot[bot]' && always() }}
    runs-on: ubuntu-24.04
    needs: [kubernetes-test-matrix]
    steps:
      - name: Print result
        run: echo ${{ needs.kubernetes-test-matrix.result }}
      - name: Interpret result
        run: |
          if [[ success == ${{ needs.kubernetes-test-matrix.result }} ]]
          then
            echo "All matrix jobs passed!"
          else
            echo "One or more matrix jobs failed."
            false
          fi
