name: Track Repository Divergence

env:
  UPSTREAM: https://github.com/open-telemetry/opentelemetry-collector-contrib.git

on:
  push:
    branches:
      - 'sky333999/divergence'
  workflow_dispatch:
    inputs:
      origin_branch:
        description: 'Origin branch to compare (default: aws-cwa-dev)'
        required: false
        default: 'bump-v0.124.1'
        type: string
      upstream_branch:
        description: 'Upstream branch to compare against (default: main)'
        required: false
        default: 'release/v0.124.x'
        type: string
      prior_snapshot:
        description: 'Prior snapshot file to compare against (optional)'
        required: false
        type: string
        default: 'divergence/snapshots/o-aws-cwa-dev_u-main_20250516-230320.txt'

jobs:
  track-divergence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup upstream remote
        run: |
          git remote add upstream ${{ env.UPSTREAM }}
          git fetch upstream

      - name: Create directories
        run: |
          mkdir -p divergence/snapshots
          mkdir -p divergence/trends

      - name: Create new snapshot
        id: create_snapshot
        env:
          ORIGIN_BRANCH: ${{ github.event.inputs.origin_branch || 'bump-v0.124.1' }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'release/v0.124.x' }}
        run: |
          # Set git config
          git config --global user.name 'Github Action'
          git config --global user.email 'action@github.com'
          
          # Generate timestamp and branch name
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="divergence-snapshot-${TIMESTAMP}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          
          # Generate snapshot filename based on branches and date
          SNAPSHOT_FILE="divergence/snapshots/o-${ORIGIN_BRANCH}_u-${UPSTREAM_BRANCH}_${TIMESTAMP}.txt"
          echo "snapshot_file=${SNAPSHOT_FILE}" >> $GITHUB_OUTPUT
          
          # Create branch for PR
          git checkout -b "${BRANCH_NAME}"
          
          # Run the diff script to create snapshot
          bash .github/workflows/scripts/divergence.sh -o "$ORIGIN_BRANCH" -u "$UPSTREAM_BRANCH" -s "$SNAPSHOT_FILE"
          
          # If prior snapshot was provided, create trend analysis
          if [ -n "divergence/snapshots/o-aws-cwa-dev_u-main_20250516-230320.txt" ]; then
            TREND_FILE="divergence/trends/o-${ORIGIN_BRANCH}_u-${UPSTREAM_BRANCH}_${TIMESTAMP}.txt"
            echo "trend_file=${TREND_FILE}" >> $GITHUB_OUTPUT
          
            {
              echo "DIVERGENCE TREND ANALYSIS"
              echo "========================"
              echo "Current snapshot: $(basename ${SNAPSHOT_FILE})"
              echo "Previous snapshot: $(basename divergence/snapshots/o-aws-cwa-dev_u-main_20250516-230320.txt)"
              echo "Generated on: $(date)"
              echo
              bash .github/workflows/scripts/divergence.sh -s "divergence/snapshots/o-aws-cwa-dev_u-main_20250516-230320.txt" -c
            } > "${TREND_FILE}"
          fi
          
          # Commit the changes
          git add divergence/
          if [ -n "divergence/snapshots/o-aws-cwa-dev_u-main_20250516-230320.txt" ]; then
            git commit -m "Add divergence snapshot and trend analysis for $ORIGIN_BRANCH vs $UPSTREAM_BRANCH"
          else
            git commit -m "Add divergence snapshot for $ORIGIN_BRANCH vs $UPSTREAM_BRANCH"
          fi
          git push -u origin HEAD
          
          # Unset git config
          git config --global --unset user.name
          git config --global --unset user.email
