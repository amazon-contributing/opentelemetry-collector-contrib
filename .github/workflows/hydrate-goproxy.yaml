name: hydrate-goproxy

on:
  push:
    branches: [aws-cwa-dev]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to hydrate (defaults to HEAD of selected branch)"
        required: false

permissions:
  contents: read

concurrency:
  group: hydrate-goproxy-${{ github.ref }}
  cancel-in-progress: false
  # Queued runs for rapid pushes may be dropped by GitHub (only one pending
  # slot per group). Use workflow_dispatch to hydrate a specific SHA.

jobs:
  hydrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.24.13
          # A warm module cache would bypass the proxy and defeat hydration
          cache: false

      - name: Hydrate Go module proxy
        shell: bash
        env:
          # Pipe separator (|) falls back to direct on ANY error including timeouts.
          # Comma (,) only falls back on 404/410, which is insufficient: proxy.golang.org
          # times out on initial fetch of this ~1.5GB repo. Direct fetch still triggers
          # the proxy's background indexer, warming it for subsequent consumers.
          GOPROXY: "https://proxy.golang.org|direct"
          # Belt-and-suspenders: modules resolved via replace bypass sumdb regardless,
          # but this prevents issues if Go behavior changes in future versions.
          GONOSUMDB: "github.com/amazon-contributing/opentelemetry-collector-contrib"
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail

          REPO_BASE="github.com/amazon-contributing/opentelemetry-collector-contrib"
          UPSTREAM_BASE="github.com/open-telemetry/opentelemetry-collector-contrib"

          # Validate workflow_dispatch SHA input format
          if [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            : # Full SHA from github.sha or valid user input
          elif [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{7,39}$ ]]; then
            : # Short SHA from user input, will be expanded below
          else
            echo "::error title=hydrate-goproxy::Input must be a hex commit SHA (7-40 chars)"
            exit 1
          fi

          # Validate and expand SHA (handles short SHAs from workflow_dispatch)
          TARGET_SHA=$(git rev-parse --verify "${TARGET_SHA}^{commit}")
          echo "Resolved TARGET_SHA: ${TARGET_SHA}"

          # Checkout target SHA so module discovery matches the target ref
          git checkout --detach "${TARGET_SHA}"

          # Derive pseudo-version timestamp and short hash
          COMMIT_TIME=$(git log -1 --format=%ct "${TARGET_SHA}")
          DATE=$(date -u -d "@${COMMIT_TIME}" +%Y%m%d%H%M%S)
          COMMIT_TIME_UTC=$(date -u -d "@${COMMIT_TIME}" +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA=${TARGET_SHA:0:12}
          echo "Target commit time (UTC): ${COMMIT_TIME_UTC}"
          echo "Pseudo-version timestamp: ${DATE}"
          echo "Pseudo-version short SHA: ${SHORT_SHA}"
          echo "Versioning policy: using v0.0.0 pseudo-version base; git tags are ignored for hydration"

          # Discover modules from go.mod files, excluding testdata and vendor
          echo "Discovering modules..."
          mapfile -t MODULE_ENTRIES < <(
            find . -name 'go.mod' -type f \
              -not -path '*/testdata/*' \
              -not -path '*/vendor/*' \
            | while read -r f; do
                upstream_path=$(awk '$1 == "module" { print $2; exit }' "$f")
                if [ -z "$upstream_path" ]; then
                  echo "::warning title=hydrate-goproxy::No module directive in ${f}" >&2
                  continue
                fi
                echo "${upstream_path}"
              done \
            | sort
          )

          TOTAL=${#MODULE_ENTRIES[@]}
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error title=hydrate-goproxy::No modules found"
            exit 1
          fi
          echo "Found ${TOTAL} modules to hydrate"

          # Derive major version from module path (for /v2+ modules)
          major_from_path() {
            local module="$1"
            local suffix="${module##*/}"
            if [[ "$suffix" =~ ^v([2-9][0-9]*)$ ]]; then
              echo "v${BASH_REMATCH[1]}"
            else
              echo "v0"
            fi
          }

          # Compute per-module pseudo-version from the target commit only. Tags are
          # intentionally ignored so inherited upstream release tags do not affect
          # fork hydration versions.
          compute_pseudo_version() {
            local module_path="$1"
            local major
            major=$(major_from_path "$module_path")
            if [ "$major" = "v0" ]; then
              echo "v0.0.0-${DATE}-${SHORT_SHA}"
            else
              echo "${major}.0.0-${DATE}-${SHORT_SHA}"
            fi
          }


          # Build go mod edit args for all modules at once
          echo "Adding require and replace directives..."
          EXPECTED_PATHS=""
          EDIT_ARGS=()
          HYDRATION_PLAN=""
          SKIPPED=0

          for upstream_path in "${MODULE_ENTRIES[@]}"; do
            # Validate and derive amazon_path using defined constants
            if [[ "$upstream_path" == "${UPSTREAM_BASE}"* ]]; then
              amazon_path="${REPO_BASE}${upstream_path#"${UPSTREAM_BASE}"}"
            elif [[ "$upstream_path" == "${REPO_BASE}"* ]]; then
              amazon_path="$upstream_path"
            else
              echo "::warning title=hydrate-goproxy::Unexpected module path: ${upstream_path}, skipping"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            pseudo=$(compute_pseudo_version "$upstream_path")
            EDIT_ARGS+=(-require "${upstream_path}@${pseudo}" -replace "${upstream_path}=${amazon_path}@${pseudo}")
            # go mod download -json reports .Path as the replacement target (verified Go 1.24.x)
            EXPECTED_PATHS="${EXPECTED_PATHS}${amazon_path}"$'\n'
            HYDRATION_PLAN="${HYDRATION_PLAN}${upstream_path} => ${amazon_path}@${pseudo}"$'\n'
          done

          ADDED=$((TOTAL - SKIPPED))
          if [ "$ADDED" -eq 0 ]; then
            echo "::error title=hydrate-goproxy::No valid modules to hydrate"
            exit 1
          fi
          echo "::group::Hydration plan (${ADDED} modules)"
          echo "tag_base=<none> (git tags ignored)"
          echo "format: module => replacement@version"
          printf '%s' "$HYDRATION_PLAN"
          echo "::endgroup::"

          # Create temp module and apply all edits in one call
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          cd "$d"
          go mod init hydrate
          go mod edit "${EDIT_ARGS[@]}"
          echo "Added ${ADDED} modules (skipped ${SKIPPED})"

          # Download all modules at once
          echo "Running go mod download..."
          DL_EXIT=0
          go mod download -json > "$d/download-results.json" 2>"$d/download-errors.log" || DL_EXIT=$?
          if [ -s "$d/download-errors.log" ]; then cat "$d/download-errors.log" >&2; fi

          FAILED=$(jq -r 'select(.Error != null) | "\(.Path): \(.Error)"' "$d/download-results.json")
          DOWNLOADED=$(jq -r 'select(.Error == null) | .Path' "$d/download-results.json" | sort -u)
          MISSING=$(comm -23 <(echo "${EXPECTED_PATHS}" | sort -u | grep -v '^$') <(echo "${DOWNLOADED}"))

          if [ -n "$FAILED" ] || [ -n "$MISSING" ] || [ "$DL_EXIT" -ne 0 ]; then
            if [ -n "$FAILED" ]; then
              echo "FAILED modules:"
              echo "$FAILED"
            fi
            if [ -n "$MISSING" ]; then
              echo "MISSING from download results:"
              echo "$MISSING"
            fi
            echo "::error title=hydrate-goproxy::Hydration failed (exit=${DL_EXIT}, failed=$(echo "$FAILED" | grep -c . || true), missing=$(echo "$MISSING" | grep -c . || true))"
            exit 1
          fi
          echo "Success: all ${ADDED} modules downloaded"
          echo "Hydration complete."
