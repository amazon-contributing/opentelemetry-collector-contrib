name: hydrate-goproxy

on:
  push:
    branches: [aws-cwa-dev, add-hydrate-goproxy-workflow]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to hydrate (defaults to HEAD of selected branch)"
        required: false

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.24.13
          cache: false

      - name: Hydrate Go module proxy
        env:
          GONOSUMDB: "github.com/amazon-contributing/*"
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          REPO_BASE="github.com/amazon-contributing/opentelemetry-collector-contrib"

          MODULE_LIST=$(find "${GITHUB_WORKSPACE}" -name 'go.mod' -type f \
            | while read -r f; do
                dir=$(dirname "$f")
                rel=${dir#"${GITHUB_WORKSPACE}"}
                if [ -z "$rel" ]; then
                  continue
                else
                  echo "${REPO_BASE}${rel}"
                fi
              done \
            | sort)

          TOTAL=$(echo "${MODULE_LIST}" | wc -l | tr -d ' ')
          echo "Found ${TOTAL} modules to hydrate at ref ${TARGET_SHA}"

          echo "Resolving commit SHA to pseudo-version..."
          PSEUDO_VERSION=$(go list -m "${REPO_BASE}/override/aws@${TARGET_SHA}" \
            | awk '{print $2}')
          [ -n "$PSEUDO_VERSION" ] || { echo "ERROR: go list -m returned empty version"; exit 1; }
          echo "Resolved: ${PSEUDO_VERSION}"

          d=$(mktemp -d)
          cd "$d"
          go mod init hydrate 2>/dev/null

          echo "Adding require and replace directives..."
          for mod in ${MODULE_LIST}; do
            upstream=${mod/amazon-contributing/open-telemetry}
            go mod edit -require "${upstream}@${PSEUDO_VERSION}"
            go mod edit -replace "${upstream}=${mod}@${PSEUDO_VERSION}"
          done
          echo "Added ${TOTAL} modules"

          echo "Running go mod download..."
          if go mod download; then
            echo "Success: all ${TOTAL} modules downloaded"
          else
            echo "FAILED: some modules failed to download"
            exit 1
          fi

          rm -rf "$d"
          echo "Hydration complete."
